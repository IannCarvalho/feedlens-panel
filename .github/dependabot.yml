version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # PrimeVue 5 (e o @primeuix/themes 3.x que o acompanha) deixou de ser MIT:
      # passou para a "PrimeUI License", com chave de licenca obrigatoria
      # (@primeui/license-manager) e aviso na tela sem chave valida. O painel
      # fica no PrimeVue 4.x (MIT), cujo tema e a linha @primeuix/themes 1.x.
      # Minor e patch do 4.x continuam chegando. Remova estas linhas so depois
      # de decidir a licenca (ver PR #28, fechado).
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/themes"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
