name: Release

# Publica o painel compilado como artefato versionado. O backend (feedlens)
# baixa este release no build da imagem Docker, fixando versão e checksum.
#
# Para publicar: ajuste "version" em package.json, faça merge e crie a tag:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: A tag precisa bater com a versão do package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} não bate com package.json (v${version})." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Empacotar
        run: bash scripts/package.sh

      - name: Criar o release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "Painel ${GITHUB_REF_NAME}" \
            --generate-notes
