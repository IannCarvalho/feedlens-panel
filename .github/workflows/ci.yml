name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # O painel exige Node >= 24.15 (engines em package.json);
          # "24" resolve para a última 24.x publicada.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gera os tipos do contrato a partir da spec OpenAPI fixada (api-spec.version)
      # e falha se o arquivo commitado divergir. Pega aqui uma spec pinada que
      # mudou sem o src/types/api.generated.ts ter sido regenerado e commitado.
      - name: Tipos da API em dia com a spec pinada
        run: |
          npm run gen:api
          git diff --exit-code src/types/api.generated.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

      # Ensaio do release: gera o mesmo tarball que o workflow de release
      # publica, sem publicar. Pega aqui um `base` errado ou um dist/ vazio,
      # em vez de descobrir só no backend.
      - name: Empacotar (ensaio do release)
        run: bash scripts/package.sh

      - name: Guardar o tarball como artefato do run
        uses: actions/upload-artifact@v7
        with:
          name: feedlens-panel-release
          path: release/
          retention-days: 7
